<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SaveTikX - TikTok Video Downloader No Watermark</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta name="description" content="Download TikTok videos without watermark in HD quality for free.">
    
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --primary: #ec4899;
            --primary-hover: #db2777;
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            margin: 0;
            font-family: 'Inter', system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .header {
            width: 100%;
            padding: 25px 0;
            text-align: center;
            background-color: var(--card-bg);
            border-bottom: 1px solid #334155;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }
        .header h1 { margin: 0; font-size: 28px; font-weight: 800; background: linear-gradient(to right, #ec4899, #8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .header p { margin: 8px 0 0 0; color: var(--text-muted); font-size: 15px; }

        .ad-banner {
            width: 100%;
            max-width: 500px;
            height: 60px;
            background-color: rgba(255, 255, 255, 0.05);
            margin-top: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #475569;
            font-size: 12px;
            border-radius: 8px;
        }

        .downloader-box {
            background: var(--card-bg);
            width: 90%;
            max-width: 500px;
            margin-top: 20px;
            padding: 30px 20px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);
            text-align: center;
            box-sizing: border-box;
            border: 1px solid #334155;
        }

        .input-wrapper { margin-bottom: 20px; }
        .url-input {
            width: 100%;
            padding: 18px;
            border-radius: 12px;
            border: 2px solid #334155;
            background-color: #0f172a;
            color: white;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
            transition: all 0.3s ease;
        }
        .url-input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(236, 72, 153, 0.2); }

        .download-btn {
            width: 100%;
            padding: 18px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .download-btn:hover { background-color: var(--primary-hover); transform: translateY(-2px); }

        .install-prompt {
            background: #10b981;
            color: white;
            padding: 12px 25px;
            border-radius: 25px;
            margin-top: 25px;
            font-weight: bold;
            cursor: pointer;
            display: none;
            box-shadow: 0 4px 6px -1px rgba(16, 185, 129, 0.4);
        }

        .loader {
            display: none;
            border: 3px solid rgba(255,255,255,0.3);
            border-top: 3px solid white;
            border-radius: 50%;
            width: 22px;
            height: 22px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="header">
        <h1>SaveTikX</h1>
        <p>Download TikTok Videos Without Watermark</p>
    </div>

    <!-- المساحة الإعلانية العلوية -->
    <div class="ad-banner">
        [Adsterra Native Banner Space]
    </div>

    <div class="downloader-box">
        <div class="input-wrapper">
            <input type="url" id="videoUrl" class="url-input" placeholder="Paste TikTok link here...">
        </div>
        
        <button class="download-btn" id="downloadBtn">
            <span id="btnText">Download HD Video</span>
            <div class="loader" id="loader"></div>
        </button>
    </div>

    <!-- المساحة الإعلانية السفلية -->
    <div class="ad-banner" style="margin-top: 30px;">
        [Adsterra Native Banner Space]
    </div>

    <div class="install-prompt" id="installBtn">
        📲 Add App to Home Screen
    </div>

    <script>
        document.getElementById('downloadBtn').addEventListener('click', async function() {
            const urlInput = document.getElementById('videoUrl').value.trim();
            const btnText = document.getElementById('btnText');
            const loader = document.getElementById('loader');

            if(!urlInput || !urlInput.includes('tiktok')) {
                alert("Please paste a valid TikTok link!");
                return;
            }

            btnText.style.display = 'none';
            loader.style.display = 'block';
            this.style.backgroundColor = '#475569';

            const options = {
                method: 'GET',
                headers: {
                    'x-rapidapi-host': 'tiktok-video-downloader-api.p.rapidapi.com',
                    'x-rapidapi-key': '4621839ebfmsh925ba9f9eed2d54p1f4743jsn5fd6ceddb145'
                }
            };

            try {
                const response = await fetch(`https://tiktok-video-downloader-api.p.rapidapi.com/media?videoUrl=${encodeURIComponent(urlInput)}`, options);
                const data = await response.json();
                
                const noWatermarkVid = data.video || data.videoUrl || (data.data && (data.data.play || data.data.hdplay));

                if (!noWatermarkVid) {
                    throw new Error("Video not found");
                }

                btnText.style.display = 'block';
                loader.style.display = 'none';
                this.style.backgroundColor = '#10b981';
                btnText.innerText = 'Downloading... 🎉';

                // توجيه المستخدم للفيديو
                window.location.href = noWatermarkVid;

                // إعلان البوب أندر (حط الرابط المباشر ديالك هنا وحيد الجوج شرطات)
                // window.open('https://YOUR_ADSTERRA_DIRECT_LINK', '_blank');

                setTimeout(() => {
                    this.style.backgroundColor = 'var(--primary)';
                    btnText.innerText = 'Download Another Video';
                }, 3000);

            } catch (error) {
                console.error(error);
                alert("Error! Make sure the link is correct.");
                btnText.style.display = 'block';
                loader.style.display = 'none';
                this.style.backgroundColor = 'var(--primary)';
                btnText.innerText = 'Download HD Video';
            }
        });

        // تفعيل تطبيق الهاتف PWA
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('installBtn').style.display = 'block';
        });

        document.getElementById('installBtn').addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    document.getElementById('installBtn').style.display = 'none';
                }
                deferredPrompt = null;
            }
        });

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => console.log(err));
        }
    </script>
</body>
</html>
